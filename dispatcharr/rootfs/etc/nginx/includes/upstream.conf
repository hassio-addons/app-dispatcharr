# Django itself, over the uWSGI protocol rather than HTTP. That is what makes
# it possible to hand it a SCRIPT_NAME per request, which is how the same
# application ends up answering correctly both at the site root and under an
# Ingress path.
upstream backend {
    server unix:/run/dispatcharr/uwsgi.sock;
}

# The WebSocket side is a separate ASGI process, and speaks plain HTTP.
upstream websocket {
    server 127.0.0.1:8001;
}
