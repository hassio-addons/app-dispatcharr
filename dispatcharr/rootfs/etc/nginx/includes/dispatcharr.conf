# Every location Dispatcharr serves, shared by the Ingress and the direct
# server. What differs between the two is carried in two variables the server
# block sets before including this: $script_name, the path the app is mounted
# under, and $sub_path, the same value written into the page for the browser.
# Both are empty on the direct server, where every rewrite below collapses into
# a no-op and the application is served exactly as upstream serves it.

# The generated frontend. Hashed filenames, so they can be kept indefinitely.
location /assets/ {
    root        /app/static;
    access_log  off;
    expires     1y;
    add_header  Cache-Control "public, immutable";
}

# Django's collected static files, favicons and the web manifest among them.
location /static/ {
    root        /app;
    access_log  off;
}

# Artwork that was uploaded rather than fetched from a provider.
location /logos/ {
    root        /data;
    access_log  off;
}

# Django authorises the download and then hands the sending back to NGINX, so
# a backup archive never travels through a Python worker.
location /protected-backups/ {
    internal;
    alias /data/backups/;
}

# Channel artwork. Requested once per visible row, so it is cached here rather
# than fetched from the provider again for every table draw. The trailing
# slash is optional because some clients strip it; the rewrite keeps both
# spellings on a single cache entry.
#
# Home Assistant strips the Ingress prefix before proxying, so $uri is the same
# whichever way the request arrived and one entry serves both.
location ~ ^/api/channels/logos/\d+/cache/?$ {
    rewrite ^(/api/channels/logos/\d+/cache)$ $1/ break;

    include /etc/nginx/includes/uwsgi_params.conf;
    uwsgi_pass backend;

    uwsgi_cache             logo_cache;
    uwsgi_cache_key         "$uri$is_args$args";
    uwsgi_cache_valid       200 24h;
    uwsgi_cache_valid       404 1m;
    uwsgi_cache_use_stale   error timeout updating;
}

location ~ ^/api/vod/vodlogos/\d+/cache/?$ {
    rewrite ^(/api/vod/vodlogos/\d+/cache)$ $1/ break;

    include /etc/nginx/includes/uwsgi_params.conf;
    uwsgi_pass backend;

    uwsgi_cache             logo_cache;
    uwsgi_cache_key         "$uri$is_args$args";
    uwsgi_cache_valid       200 24h;
    uwsgi_cache_valid       404 1m;
    uwsgi_cache_use_stale   error timeout updating;
}

location ~ ^/api/vod/(movies|series|episodes)/\d+/image/?$ {
    rewrite ^(/api/vod/(?:movies|series|episodes)/\d+/image)$ $1/ break;

    include /etc/nginx/includes/uwsgi_params.conf;
    uwsgi_pass backend;

    uwsgi_cache             logo_cache;
    uwsgi_cache_key         "$uri$is_args$args";
    uwsgi_cache_valid       200 24h;
    uwsgi_cache_valid       404 1m;
    uwsgi_cache_use_stale   error timeout updating;
}

# Programme posters. No negative caching here on purpose: a bare 404 from
# Schedules Direct is treated as transient upstream, and caching it would hold
# off a retry that would have worked.
location ~ ^/api/epg/programs/\d+/poster/?$ {
    rewrite ^(/api/epg/programs/\d+/poster)$ $1/ break;

    include /etc/nginx/includes/uwsgi_params.conf;
    uwsgi_pass backend;

    uwsgi_cache             poster_cache;
    uwsgi_cache_key         "$uri$is_args$args";
    uwsgi_cache_valid       200 14d;
    uwsgi_cache_use_stale   error timeout updating;
}

# The Django admin is not part of the interface this app presents, and its
# login is a second, separate way in. Send it back to the app's own.
location ~ ^/admin(?!/[^/]+/[^/]+/?$)(?:/|$) {
    return 301 $sub_path/login;
}

# Upstream answers these with a redirect built from the site root, which is the
# wrong place under Ingress and cannot be rewritten on the way back out: the
# uWSGI protocol has no equivalent of proxy_redirect. They are short enough to
# simply answer here instead, correctly under both servers.
location = /api     { return 301 $sub_path/api/; }
location = /output  { return 301 $sub_path/output/; }
location = /hdhr    { return 301 $sub_path/hdhr/; }
location = /proxy   { return 301 $sub_path/proxy/; }
location = /swagger { return 301 $sub_path/api/swagger/; }
location = /redoc   { return 301 $sub_path/api/redoc/; }

# Live updates for the channel table, the stats page and the notifications.
# A separate ASGI process, and the one thing here that speaks plain HTTP.
location /ws/ {
    proxy_pass          http://websocket;
    proxy_http_version  1.1;
    proxy_set_header    Upgrade $http_upgrade;
    proxy_set_header    Connection $connection_upgrade;
    proxy_set_header    Host $http_host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $forwarded_scheme;
    proxy_read_timeout  86400s;
    proxy_send_timeout  86400s;
}

# Video. Every byte of every stream this app serves goes through here, so
# nothing is buffered and nothing is allowed to time out mid-programme.
location /proxy/ {
    include /etc/nginx/includes/uwsgi_params.conf;
    uwsgi_pass backend;

    uwsgi_buffering     off;
    uwsgi_read_timeout  86400s;
    uwsgi_send_timeout  86400s;
    uwsgi_max_temp_file_size 0;
}

# The HDHomeRun emulation, which is what Plex, Emby and Jellyfin discover this
# app as. Reached on the published port; an Ingress path is of no use to them.
location /hdhr {
    include /etc/nginx/includes/uwsgi_params.conf;
    uwsgi_pass backend;
}

# Everything else, the single page application among it.
location / {
    include /etc/nginx/includes/uwsgi_params.conf;
    uwsgi_pass backend;

    uwsgi_read_timeout  600s;
    uwsgi_send_timeout  600s;

    # Dispatcharr addresses everything from the site root, which belongs to
    # Home Assistant rather than to this app when it is reached through
    # Ingress. The path is only known per request, so it is written into the
    # page on the way past.
    #
    # This is a handful of values in a document under a kilobyte: the frontend
    # reads SUB_PATH back at runtime and resolves against it, and the built
    # chunks resolve against the entry script's own URL once that is right. The
    # megabytes of JavaScript are never touched, and sub_filter_types leaves
    # every JSON response alone.
    # Written exactly as the built index.html spells them. Vite leaves the
    # inline script alone, so what goes in is what comes out; the entry script
    # and stylesheet are the two tags it rewrites, and every lazily loaded
    # chunk resolves against the entry's own URL once that one is right.
    sub_filter_once off;
    sub_filter 'window.SUB_PATH=""'   'window.SUB_PATH="$sub_path"';
    sub_filter 'window.PUBLIC_URL=""' 'window.PUBLIC_URL="$public_url"';
    sub_filter 'src="/assets/'        'src="$sub_path/assets/';
    sub_filter 'href="/assets/'       'href="$sub_path/assets/';
    sub_filter 'href="/static/'       'href="$sub_path/static/';
    sub_filter 'href="/logo.png"'     'href="$sub_path/logo.png"';
}
