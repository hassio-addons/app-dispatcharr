uwsgi_param  QUERY_STRING       $query_string;
uwsgi_param  REQUEST_METHOD     $request_method;
uwsgi_param  CONTENT_TYPE       $content_type;
uwsgi_param  CONTENT_LENGTH     $content_length;

uwsgi_param  REQUEST_URI        $request_uri;
uwsgi_param  PATH_INFO          $document_uri;
uwsgi_param  DOCUMENT_ROOT      $document_root;
uwsgi_param  SERVER_PROTOCOL    $server_protocol;
uwsgi_param  REQUEST_SCHEME     $scheme;
uwsgi_param  HTTPS              $https if_not_empty;

uwsgi_param  REMOTE_ADDR        $remote_addr;
uwsgi_param  REMOTE_PORT        $remote_port;
uwsgi_param  SERVER_PORT        $server_port;
uwsgi_param  SERVER_NAME        $server_name;

# The path this application is mounted under, which Home Assistant only settles
# on per request and which is empty when the app is reached directly. Django
# reads it out of the WSGI environment and puts it on the front of everything
# reverse() builds, which is how the artwork URLs that come back inside JSON
# payloads end up pointing somewhere the browser can actually reach. Routing is
# unaffected: Home Assistant strips the prefix before proxying, so PATH_INFO
# arrives clean either way.
uwsgi_param  SCRIPT_NAME        $script_name;

# Dispatcharr builds the absolute URLs it hands to players out of these.
uwsgi_param  HTTP_X_FORWARDED_HOST   $http_host;
uwsgi_param  HTTP_X_FORWARDED_PROTO  $forwarded_scheme;
uwsgi_param  HTTP_X_REAL_IP          $remote_addr;
uwsgi_param  HTTP_X_FORWARDED_FOR    $proxy_add_x_forwarded_for;
