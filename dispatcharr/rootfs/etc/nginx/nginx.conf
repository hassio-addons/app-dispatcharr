# Run nginx in foreground.
daemon off;

# This is run inside Docker.
user root;

# Pid storage location.
pid /var/run/nginx.pid;

# Set number of worker processes.
worker_processes 1;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

# Write error log to the app log.
error_log /proc/1/fd/1 error;

# Max num of simultaneous connections by a worker process.
events {
    worker_connections 512;
}

http {
    include /etc/nginx/includes/mime.types;

    access_log              off;
    client_max_body_size    0;
    default_type            application/octet-stream;
    gzip                    on;
    keepalive_timeout       65;
    sendfile                on;
    server_tokens           off;
    tcp_nodelay             on;
    tcp_nopush              on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Home Assistant terminates TLS in front of Ingress, so what the browser
    # actually used is only knowable from the header it sets on the way in.
    # Falling back to the scheme of this connection covers the direct server,
    # where nothing sits in front and the two are the same thing.
    map $http_x_forwarded_proto $forwarded_scheme {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # A channel list of any size asks for one artwork request per row, and each
    # one is a fetch from whatever provider supplied it. Caching them here is
    # what keeps opening the channel table from turning into thousands of
    # round trips to somebody else's server.
    uwsgi_cache_path /data/cache/logos levels=1:2 keys_zone=logo_cache:10m
                     inactive=24h use_temp_path=off;

    # Programme posters come from Schedules Direct and change far less often,
    # so they are kept considerably longer.
    uwsgi_cache_path /data/cache/posters levels=1:2 keys_zone=poster_cache:10m
                     inactive=14d use_temp_path=off;

    include /etc/nginx/includes/upstream.conf;
    include /etc/nginx/servers/*.conf;
}
