[uwsgi]
; Upstream ships an equivalent of this file that also starts Redis, both Celery
; workers, the scheduler and the WebSocket server as attached daemons. Here
; every one of those is a service of its own under S6, which is what lets any
; of them be restarted, or fail loudly, on its own.

chdir = /app
module = dispatcharr.wsgi:application
virtualenv = /opt/dispatcharr
env = DJANGO_SETTINGS_MODULE=dispatcharr.settings

; NGINX talks to this over the uWSGI protocol rather than HTTP. That is the
; whole reason for the socket: it is what lets a SCRIPT_NAME be handed over per
; request, and so what lets the same process answer correctly both at the site
; root and under an Ingress path.
socket = /run/dispatcharr/uwsgi.sock
chmod-socket = 660

; A plain HTTP listener on loopback, used by the container health check and by
; nothing else. Nothing outside the container can reach it.
http = 127.0.0.1:5656
http-keepalive = 1

master = true
vacuum = true
die-on-term = true
lazy-apps = true
workers = 4
thunder-lock = true

; A stream is held open for as long as somebody is watching, so the workers
; have to wait on many at once without spending a thread on each. gevent is
; what makes that possible, and the monkey patch has to happen before any
; application code loads or a single blocking call freezes the whole worker.
gevent = 400
gevent-early-monkey-patch = true
import = dispatcharr.gevent_patch

buffer-size = 65536
post-buffering = 4096
http-timeout = 600
socket-timeout = 600

; Static files are served by NGINX from disk, so uWSGI is never asked for them.
log-master = true
log-4xx = true
log-5xx = true
log-buffering = 1024
logformat-strftime = true
log-date = %%Y-%%m-%%d %%H:%%M:%%S
log-format = %(ftime) uwsgi.requests %(method) %(status) %(uri) %(msecs)ms
